<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/infinite-slide-carousel@1.0.1/dist/lib/infinite-slide-carousel.css" rel="stylesheet">
    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/infinite-slide-carousel@1.0.1/dist/lib/gsap-slide-carousel.umd.js"></script>
    <title>Basic Infinite Slide Carousel</title>
    <style>
        /* 슬라이드 크기와 스타일 커스터마이징 */
        .gsap-carousel-container {
            height: 200px;
        }
        .gsap-carousel-slide {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
    
</head>
<body style="background-color: grey;">
    <div style="width: 80%; margin: auto; padding-top: 50px;">
        <div class="gsap-carousel-container">
            <div class="gsap-carousel-slide" style="background-color: aliceblue; color: #333;">Slide 1</div>
            <div class="gsap-carousel-slide" style="background-color: lightcoral;">Slide 2</div>
            <div class="gsap-carousel-slide" style="background-color: lightseagreen;">Slide 3</div>
            <div class="gsap-carousel-slide" style="background-color: lightblue; color: #333;">Slide 4</div>
            <div class="gsap-carousel-slide" style="background-color: lightgoldenrodyellow; color: #333;">Slide 5</div>
        </div>
    </div>
    <script>
        // UMD 버전에서는 window.GsapSlideCarousel로 접근
        const carousel = GsapSlideCarousel.default.create({
            container: '.gsap-carousel-container',
            multiple: false,
            direction: 'left',
            autoSlideSpeed: 50,
            slideSpace: 5,  // 갭 크기
            pauseOnHover: true,
            enableDrag: true,
            onReady: () => {
                console.log('✅ Carousel ready!');
                console.log('Stride:', carousel.stride);
            }
        });
        
        console.log('Carousel instance:', carousel);
    </script>
</body>
</html>
