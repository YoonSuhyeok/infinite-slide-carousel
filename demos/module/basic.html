<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/infinite-slide-carousel@1.0.1/dist/lib/infinite-slide-carousel.css" rel="stylesheet">
    
    <!-- Import Map으로 bare import 해결 -->
    <script type="importmap">
    {
        "imports": {
            "gsap": "https://cdn.jsdelivr.net/npm/gsap@3/+esm"
        }
    }
    </script>
    
    <title>Basic Infinite Slide Carousel - ESM Module</title>
    <style>
        /* 슬라이드 크기와 스타일 커스터마이징 */
        .gsap-carousel-container {
            height: 200px;
        }
        .gsap-carousel-slide {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body style="background-color: #f5f5f5;">
    <div style="width: 80%; margin: auto; padding-top: 50px;">
        <h1 style="text-align: center; color: #333;">ESM Module Example</h1>
        <div class="gsap-carousel-container">
            <div class="gsap-carousel-slide" style="background-color: aliceblue; color: #333;">Slide 1</div>
            <div class="gsap-carousel-slide" style="background-color: lightcoral;">Slide 2</div>
            <div class="gsap-carousel-slide" style="background-color: lightseagreen;">Slide 3</div>
            <div class="gsap-carousel-slide" style="background-color: lightblue; color: #333;">Slide 4</div>
            <div class="gsap-carousel-slide" style="background-color: lightgoldenrodyellow; color: #333;">Slide 5</div>
        </div>
        
        <div style="margin-top: 20px; text-align: center;">
            <button onclick="carousel.pause()" style="padding: 10px 20px; margin: 5px;">Pause</button>
            <button onclick="carousel.play()" style="padding: 10px 20px; margin: 5px;">Play</button>
            <button onclick="carousel.setSpeed(50)" style="padding: 10px 20px; margin: 5px;">Slow</button>
            <button onclick="carousel.setSpeed(150)" style="padding: 10px 20px; margin: 5px;">Fast</button>
        </div>
    </div>
    
    <script type="module">
        import GsapSlideCarousel from 'https://cdn.jsdelivr.net/npm/infinite-slide-carousel@latest/dist/lib/gsap-slide-carousel.es.js';
        
        const carousel = GsapSlideCarousel.create({
            container: '.gsap-carousel-container',
            multiple: false,
            direction: 'left',
            autoSlideSpeed: 80,
            slideSpace: 20,
            pauseOnHover: true,
            enableDrag: true,
            onReady: () => {
                console.log('✅ Carousel ready!');
            },
            onExpose: (index, slide) => {
                console.log(`👀 Slide ${index} exposed:`, slide.textContent);
            },
            onClick: (index, slide) => {
                console.log(`🖱️ Clicked slide ${index}:`, slide.textContent);
            }
        });
        
        // 전역으로 노출 (버튼에서 접근 가능하도록)
        window.carousel = carousel;
        
        console.log('Carousel instance:', carousel);
    </script>
</body>
</html>
