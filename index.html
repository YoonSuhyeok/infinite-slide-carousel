<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP Slide Carousel - Dev Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .carousel-wrapper {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .gsap-carousel-container {
            height: 200px;
        }

        /* 슬라이드 커스텀 스타일 */
        .gsap-carousel-slide {
            min-width: 300px;
            width: 300px;
            height: 200px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
        }

        /* 슬라이드 색상 - nth-child로 순서대로 지정 */
        .gsap-carousel-slide:nth-child(6n+1) { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
        }
        .gsap-carousel-slide:nth-child(6n+2) { 
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); 
        }
        .gsap-carousel-slide:nth-child(6n+3) { 
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); 
        }
        .gsap-carousel-slide:nth-child(6n+4) { 
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); 
        }
        .gsap-carousel-slide:nth-child(6n+5) { 
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); 
        }
        .gsap-carousel-slide:nth-child(6n) { 
            background: linear-gradient(135deg, #30cfd0 0%, #330867 100%); 
        }

        .controls {
            text-align: center;
            margin-top: 30px;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 0 10px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .info h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .info p {
            color: #666;
            line-height: 1.6;
            margin: 5px 0;
        }

        .log {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .log-item {
            padding: 5px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-left: 10px;
        }

        .status.playing {
            background: #43e97b;
            color: white;
        }

        .status.paused {
            background: #fa709a;
            color: white;
        }

        .status.destroyed {
            background: #999;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎠 GSAP Slide Carousel Dev Test
            <span class="status playing" id="status">Loading...</span>
        </h1>

        <div class="carousel-wrapper">
            <div class="gsap-carousel-container">
                <div class="gsap-carousel-slide">Slide 1</div>
                <div class="gsap-carousel-slide">Slide 2</div>
                <div class="gsap-carousel-slide">Slide 3</div>
                <div class="gsap-carousel-slide">Slide 4</div>
                <div class="gsap-carousel-slide">Slide 5</div>
                <div class="gsap-carousel-slide">Slide 6</div>
            </div>

            <div class="controls">
                <button class="btn" id="pauseBtn">⏸️ Pause</button>
                <button class="btn" id="playBtn">▶️ Play</button>
                <button class="btn" id="destroyBtn">🗑️ Destroy</button>
            </div>

            <div class="info">
                <h3>📊 Event Log</h3>
                <p>슬라이드를 클릭하거나 노출되는 이벤트를 확인하세요:</p>
                <div class="log" id="eventLog">
                    <div class="log-item">Initializing...</div>
                </div>
            </div>
        </div>

        <div class="info">
            <h3>ℹ️ 사용 방법</h3>
            <p>• 드래그하여 슬라이드를 이동할 수 있습니다</p>
            <p>• 마우스를 올리면 자동 슬라이드가 일시 정지됩니다</p>
            <p>• 슬라이드를 클릭하면 이벤트가 발생합니다</p>
            <p>• Pause/Play 버튼으로 애니메이션을 제어할 수 있습니다</p>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
