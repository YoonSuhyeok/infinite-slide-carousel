<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../../dist/lib/carousel.css" rel="stylesheet">
    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
    <script src="../../dist/lib/gsap-slide-carousel.umd.js"></script>
    <title>GSAP Version - Performance Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #00d4ff;
            margin-bottom: 10px;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 10px;
        }

        .metric {
            padding: 15px;
            background: #333;
            border-radius: 8px;
            text-align: center;
        }

        .metric-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #00d4ff;
        }

        .metric-value.good {
            color: #00ff88;
        }

        .metric-value.warning {
            color: #ffaa00;
        }

        .metric-value.bad {
            color: #ff4444;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            background: #00d4ff;
            border: none;
            border-radius: 5px;
            color: #1a1a1a;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #00a8cc;
        }

        button:active {
            transform: scale(0.98);
        }

        .carousel-wrapper {
            width: 100%;
            margin-bottom: 30px;
        }

        .gsap-carousel-slide {
            width: 300px;
            height: 200px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .slide-content {
            text-align: center;
        }

        .slide-number {
            font-size: 48px;
            margin-bottom: 10px;
        }

        #fps-chart {
            width: 100%;
            height: 200px;
            background: #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            position: relative;
        }

        .chart-canvas {
            width: 100%;
            height: 100%;
        }

        .gsap-carousel-container {
            position: relative;      /* 필수 */
            overflow: hidden;        /* 필수 */
            width: 100%;
            cursor: grab;
        }

        .gsap-carousel-slide {
            position: absolute;      /* 필수 */
            top: 0;                  /* 필수 */
            left: 0;                 /* 필수 */
            will-change: transform;  /* 성능 최적화 */
            user-select: none;       /* 드래그 시 텍스트 선택 방지 */
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 GSAP Version - Performance Test</h1>
        <p>Monitoring FPS, Memory, and Animation Performance</p>
    </div>

    <div class="metrics">
        <div class="metric">
            <div class="metric-label">FPS</div>
            <div class="metric-value" id="fps">--</div>
        </div>
        <div class="metric">
            <div class="metric-label">Frame Time (ms)</div>
            <div class="metric-value" id="frameTime">--</div>
        </div>
        <div class="metric">
            <div class="metric-label">Memory (MB)</div>
            <div class="metric-value" id="memory">--</div>
        </div>
        <div class="metric">
            <div class="metric-label">CPU Usage (%)</div>
            <div class="metric-value" id="cpu">--</div>
        </div>
        <div class="metric">
            <div class="metric-label">Avg FPS</div>
            <div class="metric-value" id="avgFps">--</div>
        </div>
        <div class="metric">
            <div class="metric-label">Min FPS</div>
            <div class="metric-value" id="minFps">--</div>
        </div>
    </div>

    <div class="controls">
        <button onclick="startTest()">Start Test</button>
        <button onclick="stopTest()">Stop Test</button>
        <button onclick="resetMetrics()">Reset Metrics</button>
        <button onclick="addSlides(10)">Add 10 Slides</button>
        <button onclick="increaseSpeed()">Speed Up (2x)</button>
        <button onclick="decreaseSpeed()">Speed Down (0.5x)</button>
        <button onclick="exportResults()">Export Results</button>
    </div>

    <div class="carousel-wrapper">
        <div class="gsap-carousel-container">
            <!-- 초기 슬라이드 -->
        </div>
    </div>

    <div id="fps-chart">
        <canvas class="chart-canvas" id="chartCanvas"></canvas>
    </div>

    <script>
        let carousel;
        let performanceMonitor;
        let testRunning = false;

        // 성능 모니터링 클래스
        class PerformanceMonitor {
            constructor() {
                this.frameCount = 0;
                this.lastTime = performance.now();
                this.fps = 0;
                this.frameTime = 0;
                this.fpsHistory = [];
                this.maxHistoryLength = 100;
                this.measuring = false;
                
                // 통계
                this.avgFps = 0;
                this.minFps = Infinity;
                this.maxFps = 0;
                this.totalFrames = 0;
                
                this.chart = new SimpleChart('chartCanvas');
            }

            start() {
                this.measuring = true;
                this.measure();
            }

            stop() {
                this.measuring = false;
            }

            reset() {
                this.fpsHistory = [];
                this.avgFps = 0;
                this.minFps = Infinity;
                this.maxFps = 0;
                this.totalFrames = 0;
                this.frameCount = 0;
            }

            measure() {
                if (!this.measuring) return;

                const currentTime = performance.now();
                this.frameCount++;

                // FPS 계산 (매 초마다)
                if (currentTime >= this.lastTime + 1000) {
                    this.fps = Math.round(this.frameCount * 1000 / (currentTime - this.lastTime));
                    this.frameTime = ((currentTime - this.lastTime) / this.frameCount).toFixed(2);
                    
                    // 통계 업데이트
                    this.totalFrames++;
                    this.minFps = Math.min(this.minFps, this.fps);
                    this.maxFps = Math.max(this.maxFps, this.fps);
                    this.avgFps = Math.round(
                        (this.avgFps * (this.totalFrames - 1) + this.fps) / this.totalFrames
                    );

                    // 히스토리 업데이트
                    this.fpsHistory.push(this.fps);
                    if (this.fpsHistory.length > this.maxHistoryLength) {
                        this.fpsHistory.shift();
                    }

                    this.updateUI();
                    this.chart.update(this.fpsHistory);

                    this.frameCount = 0;
                    this.lastTime = currentTime;
                }

                requestAnimationFrame(() => this.measure());
            }

            updateUI() {
                const fpsEl = document.getElementById('fps');
                const frameTimeEl = document.getElementById('frameTime');
                const avgFpsEl = document.getElementById('avgFps');
                const minFpsEl = document.getElementById('minFps');
                const memoryEl = document.getElementById('memory');
                const cpuEl = document.getElementById('cpu');

                // FPS 색상 설정
                fpsEl.textContent = this.fps;
                fpsEl.className = 'metric-value';
                if (this.fps >= 55) fpsEl.classList.add('good');
                else if (this.fps >= 30) fpsEl.classList.add('warning');
                else fpsEl.classList.add('bad');

                frameTimeEl.textContent = this.frameTime;
                avgFpsEl.textContent = this.avgFps;
                minFpsEl.textContent = this.minFps === Infinity ? '--' : this.minFps;

                // 메모리 사용량 (Chrome only)
                if (performance.memory) {
                    const usedMB = (performance.memory.usedJSHeapSize / 1048576).toFixed(2);
                    memoryEl.textContent = usedMB;
                }

                // CPU는 브라우저에서 직접 측정 불가, 프레임타임으로 추정
                const estimatedCpu = Math.min(100, Math.round((this.frameTime / 16.67) * 100));
                cpuEl.textContent = estimatedCpu;
            }

            getResults() {
                return {
                    library: 'GSAP',
                    avgFps: this.avgFps,
                    minFps: this.minFps,
                    maxFps: this.maxFps,
                    avgFrameTime: (1000 / this.avgFps).toFixed(2),
                    memory: performance.memory ? (performance.memory.usedJSHeapSize / 1048576).toFixed(2) : 'N/A',
                    slideCount: carousel ? document.querySelectorAll('.gsap-carousel-slide').length : 0,
                    timestamp: new Date().toISOString()
                };
            }
        }

        // 간단한 차트 클래스
        class SimpleChart {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
            }

            update(data) {
                const ctx = this.ctx;
                const width = this.canvas.width;
                const height = this.canvas.height;

                // 클리어
                ctx.clearRect(0, 0, width, height);

                if (data.length === 0) return;

                // 그리드
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 1;
                
                // 60 FPS 라인
                const y60 = height - (60 / 70) * height;
                ctx.beginPath();
                ctx.moveTo(0, y60);
                ctx.lineTo(width, y60);
                ctx.stroke();
                
                ctx.fillStyle = '#00ff88';
                ctx.font = '10px Arial';
                ctx.fillText('60 FPS', 5, y60 - 5);

                // 30 FPS 라인
                const y30 = height - (30 / 70) * height;
                ctx.strokeStyle = '#ffaa00';
                ctx.beginPath();
                ctx.moveTo(0, y30);
                ctx.lineTo(width, y30);
                ctx.stroke();
                
                ctx.fillStyle = '#ffaa00';
                ctx.fillText('30 FPS', 5, y30 - 5);

                // 데이터 그리기
                ctx.strokeStyle = '#00d4ff';
                ctx.lineWidth = 2;
                ctx.beginPath();

                const step = width / (data.length - 1);
                data.forEach((fps, i) => {
                    const x = i * step;
                    const y = height - (Math.min(fps, 70) / 70) * height;
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });

                ctx.stroke();

                // 점 그리기
                ctx.fillStyle = '#00d4ff';
                data.forEach((fps, i) => {
                    const x = i * step;
                    const y = height - (Math.min(fps, 70) / 70) * height;
                    ctx.beginPath();
                    ctx.arc(x, y, 2, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
        }

        // 슬라이드 생성
        function createSlides(count) {
            const container = document.querySelector('.gsap-carousel-container');
            const colors = [
                'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
                'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
                'linear-gradient(135deg, #30cfd0 0%, #330867 100%)',
                'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
                'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)'
            ];

            for (let i = 0; i < count; i++) {
                const slide = document.createElement('div');
                slide.className = 'gsap-carousel-slide';
                slide.style.background = colors[i % colors.length];
                slide.innerHTML = `
                    <div class="slide-content">
                        <div class="slide-number">${i + 1}</div>
                        <div>Slide ${i + 1}</div>
                    </div>
                `;
                container.appendChild(slide);
            }
        }

        // 초기화
        function init() {
            // 초기 슬라이드 생성 (20개)
            createSlides(20);

            // 캐러셀 초기화
            carousel = GsapSlideCarousel.default.create({
                container: '.gsap-carousel-container',
                multiple: false,
                direction: 'left',
                transitionDuration: 2000,
                slideSpace: 20,
                pauseOnHover: false,
                enableDrag: true
            });

            // 현재 속도 저장 (내부 접근 불가하므로)
            carousel._currentDuration = 2000;

            // 성능 모니터 시작
            performanceMonitor = new PerformanceMonitor();
            performanceMonitor.start();
            testRunning = true;

            console.log('✅ GSAP Carousel initialized');
        }

        function startTest() {
            if (!testRunning) {
                performanceMonitor.start();
                if (carousel) carousel.play();
                testRunning = true;
                console.log('▶️ Test started');
            }
        }

        function stopTest() {
            if (testRunning) {
                performanceMonitor.stop();
                if (carousel) carousel.pause();
                testRunning = false;
                console.log('⏸️ Test stopped');
            }
        }

        function resetMetrics() {
            performanceMonitor.reset();
            console.log('🔄 Metrics reset');
        }

        function addSlides(count) {
            const currentCount = document.querySelectorAll('.gsap-carousel-slide').length;
            const currentDuration = carousel._currentDuration || 2000;
            createSlides(count);
            
            // 캐러셀 재초기화
            if (carousel) {
                carousel.destroy();
            }
            
            carousel = GsapSlideCarousel.default.create({
                container: '.gsap-carousel-container',
                multiple: false,
                direction: 'left',
                transitionDuration: currentDuration,
                slideSpace: 20,
                pauseOnHover: false,
                enableDrag: true
            });
            
            carousel._currentDuration = currentDuration;
            console.log(`➕ Added ${count} slides (total: ${currentCount + count})`);
        }

        function increaseSpeed() {
            if (carousel) {
                const currentDuration = carousel._currentDuration || 2000;
                const newDuration = Math.max(500, currentDuration / 2);
                carousel.setSpeed(newDuration);
                carousel._currentDuration = newDuration;
                console.log(`⚡ Speed increased (duration: ${newDuration}ms)`);
            }
        }

        function decreaseSpeed() {
            if (carousel) {
                const currentDuration = carousel._currentDuration || 2000;
                const newDuration = Math.min(10000, currentDuration * 2);
                carousel.setSpeed(newDuration);
                carousel._currentDuration = newDuration;
                console.log(`🐌 Speed decreased (duration: ${newDuration}ms)`);
            }
        }

        function exportResults() {
            const results = performanceMonitor.getResults();
            const json = JSON.stringify(results, null, 2);
            
            // 콘솔에 출력
            console.log('📊 Performance Results:', results);
            
            // 파일로 다운로드
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `gsap-performance-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            console.log('💾 Results exported');
        }

        // 페이지 로드 시 초기화
        window.addEventListener('load', init);

        // 페이지 언로드 시 정리
        window.addEventListener('beforeunload', () => {
            if (carousel) carousel.destroy();
            if (performanceMonitor) performanceMonitor.stop();
        });
    </script>
</body>
</html>
